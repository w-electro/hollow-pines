<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PawTales</title>
<meta name="description" content="Draw your characters. Watch them come alive and tell their own stories — with AI that runs right in your browser.">
<style>
  :root { --bg:#14121c; --ink:#efe9ff; --dim:#a79fc0; --accent:#ff9a5a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background: radial-gradient(1200px 600px at 50% -10%, #2a2142, var(--bg)); color:var(--ink);
         font: 17px/1.55 system-ui, sans-serif; display:grid; place-items:center; padding: 24px 16px; }
  main { max-width: 560px; text-align: center; }
  .paw { font-size: 64px; line-height: 1; }
  h1 { font-size: clamp(36px, 8vw, 56px); margin: 12px 0 6px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  p { color: var(--dim); margin: 0 auto 10px; }
  .soon { display:inline-block; margin-top: 18px; padding: 8px 16px; border: 1px solid #4b4466; border-radius: 999px; font-size: 14px; color: var(--dim); }
</style>
</head>
<body>
<main>
  <div class="paw" aria-hidden="true">🐾</div>
  <h1>Paw<span>Tales</span></h1>
  <p>Draw your characters. Watch them come alive, make friends, start rivalries, and tell their own stories.</p>
  <p>The AI runs right in your browser — nothing you make leaves your device.</p>
  <span class="soon">Coming soon</span>
</main>
</body>
</html>
